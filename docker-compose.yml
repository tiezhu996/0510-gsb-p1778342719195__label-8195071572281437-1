version: '3.8'

services:
  db:
    image: mysql:5.7
    container_name: labelease-db
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: labelease
      MYSQL_USER: labelease
      MYSQL_PASSWORD: labelease123
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - labelease-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: labelease-backend
    volumes:
      - ./backend:/var/www/html
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: labelease
      DB_USERNAME: root
      DB_PASSWORD: rootpassword
    depends_on:
      db:
        condition: service_healthy
    networks:
      - labelease-net

  frontend:
    image: nginx:alpine
    container_name: labelease-frontend
    ports:
      - "3000:80"
    volumes:
      - ./backend:/var/www/html
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
    networks:
      - labelease-net

networks:
  labelease-net:
    driver: bridge

volumes:
  mysql_data:
