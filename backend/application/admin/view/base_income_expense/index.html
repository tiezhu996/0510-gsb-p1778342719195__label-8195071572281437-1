        <div class="table-container">
            <?php if (empty($list)): ?>
                <div class="empty-state">暂无数据，请添加<?php echo $moduleName; ?>记录</div>

                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>类型</th>
                            <th>金额</th>
                            <th>分类</th>
                            <?php foreach ($extraFields as $field => $config): ?>
                            <th><?php echo $config['label']; ?></th>
                            <?php endforeach; ?>
                            <?php if ($showDescriptionInList): ?>
                            <th>描述</th>
                            <?php endif; ?>
                            <th>日期</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody>
                        <?php foreach ($list as $item): ?>
                        <tr>
                            <td><?php echo $item['id']; ?></td>
                            <td class="type-<?php echo $item['type']; ?>"><?php echo $item['type'] == 'income' ? '收入' : '支出'; ?></td>
                            <td>¥<?php echo number_format($item['amount'], 2); ?></td>
                            <td><?php echo htmlspecialchars($item['category']); ?></td>
                            <?php foreach ($extraFields as $field => $config): ?>
                            <td><?php echo htmlspecialchars($item[$field]); ?></td>
                            <?php endforeach; ?>
                            <?php if ($showDescriptionInList): ?>
                            <td><?php echo mb_substr(htmlspecialchars($item['description']), 0, 30); ?></td>
                            <?php endif; ?>
                            <td><?php echo $item['date']; ?></td>
                            <td class="actions">
                                <a href="/admin/<?php echo $controllerPath; ?>/edit/<?php echo $item['id']; ?>">编辑</a>
                                <a href="/admin/<?php echo $controllerPath; ?>/delete/<?php echo $item['id']; ?>" class="delete" onclick="return confirm('确定要删除吗？')">删除</a>

                        </tr>

                    </tbody>
                </table>
